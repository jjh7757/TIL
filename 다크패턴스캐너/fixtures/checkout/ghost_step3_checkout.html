<!-- 정답: 3단계에서 '배송비'가 0원 -> 3,000원으로 바뀐다. 라벨은 같으므로 이름 매칭으로는
     못 잡고, 같은 라벨의 금액 변화를 추적해야만 잡힌다. -->
<meta charset="utf-8">
<title>[fixture] 유령 배송비 3단계 · 결제</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 8px 0; border-bottom: 1px solid #eee; }
  td.num { text-align: right; }
  .total td { font-size: 1.4rem; font-weight: 700; border-bottom: none; }
  button { margin-top: 20px; padding: 12px 24px; background: #d00; color: #fff; border: 0;
           border-radius: 6px; font-size: 1rem; }
</style>

<h1>결제</h1>
<table>
  <tr><td>캠핑 의자</td><td class="num">45,000원</td></tr>
  <tr><td>배송비</td><td class="num">3,000원</td></tr>
  <tr class="total"><td>최종 결제 금액</td><td class="num" id="total">48,000원</td></tr>
</table>

<button id="pay">결제하기</button>
