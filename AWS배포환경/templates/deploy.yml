# 앱 저장소의 .github/workflows/deploy.yml 로 복사해서 쓴다.
# 치환할 것: APP_NAME, INSTANCE_ID, ROLE_ARN (아래 env / role-to-assume)
name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# OIDC로 임시 자격증명을 받기 위해 필요. 장기 액세스 키를 만들지 않는 핵심.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  APP_NAME: CHANGE_ME              # ECR 리포지토리 이름 = 서버의 /srv/<이름> = 컨테이너 이름
  INSTANCE_ID: i-05ee0665bbba15a52

# 동시에 두 번 배포되지 않도록 (앞선 실행은 취소)
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # 네이티브 arm64 러너. 퍼블릭 저장소는 무료, 프라이빗은 과금된다.
    # 프라이빗이면 ubuntu-latest + QEMU로 바꿀 것 (느려짐, 아래 주석 참고)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: AWS 자격증명 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::403187831140:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 프라이빗 저장소라 x86 러너를 쓸 경우에만 필요 (arm 러너에서는 불필요):
      # - uses: docker/setup-qemu-action@v3
      # - uses: docker/setup-buildx-action@v3

      - name: 빌드 & ECR 푸시
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$APP_NAME"
          # NEXT_PUBLIC_* 같은 빌드시점 변수가 필요하면 --build-arg 로 여기서 넘긴다
          docker build --platform linux/arm64 -t "$IMAGE:$SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"

      - name: SSM으로 배포
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy $APP_NAME" \
            --parameters "commands=[\"/usr/local/bin/deploy-app $APP_NAME $SHA\"]" \
            --query "Command.CommandId" --output text)
          echo "CommandId: $CMD_ID"

          # send-command 직후엔 invocation이 아직 없을 수 있어 잠깐 기다린다
          sleep 5
          aws ssm wait command-executed \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query Status --output text)

          echo "----- 서버 출력 -----"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text >&2
          echo "---------------------"

          # 이 체크가 없으면 서버에서 실패해도 워크플로가 초록색으로 뜬다
          if [ "$STATUS" != "Success" ]; then
            echo "배포 실패: $STATUS"
            exit 1
          fi
          echo "배포 성공"
